<!doctype html>
<html lang="ms" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>BukuServis — Rekod Servis &amp; Minyak</title>
<meta name="description" content="Rekod servis, mileage dan isi minyak untuk kereta dan motosikal.">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/profile-256.jpg">
<link rel="stylesheet" href="css/style.css?v=1.3.6">
<script>
  /* elak kilat tema salah sebelum CSS/JS utama dimuatkan */
  (function () {
    try {
      var p = localStorage.getItem('bs.theme') || 'auto';
      var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePref = p;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#131311' : '#f6f5f2');
    } catch (e) { /* ignore */ }
  })();
</script>
</head>
<body>

<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-box">
    <div class="splash-ring"><img src="assets/profile-256.jpg" alt="BukuServis"></div>
    <div class="splash-name">BukuServis</div>
    <div class="splash-tag">Rekod servis &amp; minyak</div>
    <div class="splash-load"><span></span></div>
  </div>
</div>
<noscript><style>#splash{display:none !important}</style></noscript>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">BS</span>
      <span class="brand-text">BukuServis</span>
    </div>
    <div class="topbar-actions">
      <span id="mode-badge" class="badge" hidden>Demo</span>
      <button id="theme-btn" class="icon-btn" type="button" title="Tukar tema" aria-label="Tukar tema">◐</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <div class="loading">Memuatkan…</div>
  </main>

  <button id="fab" class="fab" type="button" title="Tambah rekod" aria-label="Tambah rekod">+</button>

  <nav class="tabbar" aria-label="Navigasi utama">
    <button class="tab" data-act="nav" data-view="dashboard"><span class="tab-ico">⌂</span><span>Utama</span></button>
    <button class="tab" data-act="nav" data-view="history"><span class="tab-ico">≡</span><span>Sejarah</span></button>
    <button class="tab" data-act="nav" data-view="reports"><span class="tab-ico">◔</span><span>Laporan</span></button>
    <button class="tab" data-act="nav" data-view="settings"><span class="tab-ico">⚙</span><span>Tetapan</span></button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script src="js/api.js?v=1.3.6"></script>
<script src="js/app.js?v=1.3.6"></script>
</body>
</html>
