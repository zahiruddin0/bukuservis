name = "bukuservis"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# Binding D1 untuk deploy melalui Dashboard Cloudflare Pages:
#   Settings → Functions → D1 database bindings → Variable name: DB
#
# Jika guna wrangler CLI, buka komen di bawah dan isi database_id sebenar
# (dapat daripada `wrangler d1 create bukuservis`):
#
# [[d1_databases]]
# binding = "DB"
# database_name = "bukuservis"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
