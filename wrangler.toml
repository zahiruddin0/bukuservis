name = "bukuservis"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Fail statik (index.html, css, js, assets) dihantar dari folder public/
[assets]
directory = "./public"
binding = "ASSETS"

# ------------------------------------------------------------------
# PENTING — binding D1 MESTI ditulis di sini.
#
# wrangler.toml ialah sumber utama konfigurasi. Setiap kali `wrangler deploy`
# (termasuk deploy automatik dari GitHub), binding yang hanya ditambah di
# dashboard akan DIPADAM. Itulah punca ralat
# "Cannot read properties of undefined (reading 'prepare')".
#
# Isi database_id sebenar di bawah dan buka komen. Dapatkan ID dari:
#   Cloudflare dashboard → Storage & Databases → D1 → bukuservis
#   (ruang "Database ID"), atau jalankan: npx wrangler d1 list
#
# [[d1_databases]]
# binding = "DB"
# database_name = "bukuservis"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# ------------------------------------------------------------------

# Jangan padam pemboleh ubah teks yang ditetapkan di dashboard.
keep_vars = true
